<html lang="en">
  <head>
    <meta charset="utf-8" />
   <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />
    <meta name="google" content="notranslate" />
    <!-- Updated viewport for better mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
    
    <meta name="theme-color" content="#000000" />
    
    <!-- Fixed: Updated meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <meta
      name="description"
      content="ZenTech - Complete Restaurant Management System for Ethiopian Restaurants"
    />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="ZenTech - Restaurant Management System" />
    <meta property="og:description" content="Complete Point of Sale system for Ethiopian restaurants with 5 role-based interfaces" />
    <meta property="og:type" content="website" />
    
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preload fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <title>ZenTech - Ethiopian Restaurant POS System</title>
    
    <style>
      body {
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
        transition: background-color 0.3s ease;
      }
      
      /* Dark mode body style */
      .dark body {
        background-color: #111827 !important;
      }
    </style>
    
    <!-- IMMEDIATE DARK MODE SCRIPT - Runs before React loads -->
    <script>
      (function() {
        // Get theme from localStorage
        let theme = localStorage.getItem('theme');
        
        // Check system preference if no saved theme
        if (!theme) {
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = prefersDark ? 'dark' : 'light';
        }
        
        // Apply theme to HTML element immediately
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          console.log('Dark mode applied immediately');
        } else {
          document.documentElement.classList.remove('dark');
          console.log('Light mode applied immediately');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
